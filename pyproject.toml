[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aire"
version = "0.1.1"
description = "Agent-first AI creation library: one consistent interface from idea to deployed AI system."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "aire contributors" }]
keywords = ["ai", "agents", "llm", "rag", "workflows", "evaluation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.6",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
# Provider integrations (all reached through httpx; kept as named extras for clarity)
openai = []
anthropic = []
ollama = []
huggingface = []
qdrant = []
chroma = []
# Serving
serve = ["fastapi>=0.110", "uvicorn>=0.29"]
# Optional acceleration / data ecosystem
numpy = ["numpy>=1.26"]
datasets = ["datasets>=2.18"]
# Training adapters (lazy; never imported by core)
training = ["torch>=2.2"]
vision = ["pillow>=10.0"]
all = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "numpy>=1.26",
    "datasets>=2.18",
    "pillow>=10.0",
]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "types-pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.scripts]
aire = "aire.cli.main:app"

[project.entry-points."aire.providers"]
mock = "aire.integrations.mock:MockProvider"
echo = "aire.integrations.mock:EchoProvider"

[tool.hatch.build.targets.wheel]
packages = ["src/aire"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["docs", ".venv"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "C90",  # mccabe
    "RUF",  # ruff-specific
    "ASYNC", # flake8-async
    "S",    # flake8-bandit
    "ANN",  # annotations (public API typing discipline)
    "PT",   # pytest style
]
ignore = [
    "S101",    # asserts are expected in tests
    "ANN401",  # Any is allowed where explicitly justified
    "PLR0913", # many-argument builders are intentional
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S", "PT"]
"examples/**" = ["ANN", "S", "T201"]
"*/__init__.py" = ["F401"]
# typer.Option in argument defaults is the idiomatic typer pattern
"src/aire/cli/**" = ["B008"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["aire"]
strict = true
warn_unreachable = true
disallow_any_generics = false
exclude = "(tests|examples|docs)"

[[tool.mypy.overrides]]
module = ["yaml", "yaml.*"]
ignore_missing_imports = true

# fastapi is an optional dependency; its decorators are untyped when absent
[[tool.mypy.overrides]]
module = ["aire.deployment.fastapi_app", "aire.deployment.gateway"]
disable_error_code = ["untyped-decorator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: tests that exercise multiple subsystems together",
    "live: tests that require network access or credentials (skipped by default)",
    "performance: timing and resource usage checks",
    "security: adversarial and safety checks",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["src/aire"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]
