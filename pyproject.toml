[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aire"
version = "0.3.5"
description = "Agent-first AI creation library: one consistent interface from idea to deployed AI system."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "aire contributors" }]
keywords = ["ai", "agents", "llm", "rag", "workflows", "evaluation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.6",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/desenyon/aire"
Documentation = "https://github.com/desenyon/aire/tree/main/docs"
Repository = "https://github.com/desenyon/aire"
Changelog = "https://github.com/desenyon/aire/blob/main/CHANGELOG.md"
Issues = "https://github.com/desenyon/aire/issues"

[project.optional-dependencies]
# Provider integrations (all reached through httpx; kept as named extras for clarity)
openai = []
anthropic = []
ollama = []
huggingface = []
qdrant = []
chroma = []
# Serving
serve = ["fastapi>=0.110", "uvicorn>=0.29"]
# Optional acceleration / data ecosystem
numpy = ["numpy>=1.26"]
datasets = ["datasets>=2.18"]
# Model creation backends (lazy; never imported by core)
ml = ["scikit-learn>=1.4", "pandas>=2.0"]
torch = ["torch>=2.2"]
keras = ["keras>=3.0"]
xgboost = ["xgboost>=2.0"]
lightgbm = ["lightgbm>=4.0"]
catboost = ["catboost>=1.2"]
polars = ["polars>=0.20"]
training = ["torch>=2.2"]
vision = ["pillow>=10.0"]
# 0.3 platform extras (all lazy)
pgvector = ["psycopg[binary]>=3.1"]
neo4j = ["neo4j>=5.14"]
redis = ["redis>=5.0"]
peft = ["peft>=0.10", "transformers>=4.38"]
optuna = ["optuna>=3.5"]
pypdf = ["pypdf>=4.0"]
ocr = ["pypdf>=4.0", "pillow>=10.0", "pytesseract>=0.3.10", "pypdfium2>=4.0"]
eval = ["sacrebleu>=2.4", "sentence-transformers>=2.7"]
all = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "numpy>=1.26",
    "datasets>=2.18",
    "scikit-learn>=1.4",
    "pandas>=2.0",
    "pillow>=10.0",
    "torch>=2.2",
    "keras>=3.0",
    "xgboost>=2.0",
    "lightgbm>=4.0",
    "catboost>=1.2",
    "polars>=0.20",
    "psycopg[binary]>=3.1",
    "neo4j>=5.14",
    "redis>=5.0",
    "peft>=0.10",
    "transformers>=4.38",
    "optuna>=3.5",
    "pypdf>=4.0",
    "pytesseract>=0.3.10",
    "pypdfium2>=4.0",
    "sacrebleu>=2.4",
    "sentence-transformers>=2.7",
]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "types-pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=1.0.6",
]

[project.scripts]
aire = "aire.cli.main:app"

[project.entry-points."aire.providers"]
openai = "aire.integrations.openai:OpenAIProvider"
anthropic = "aire.integrations.anthropic:AnthropicProvider"
ollama = "aire.integrations.ollama:OllamaProvider"
huggingface = "aire.integrations.huggingface:HuggingFaceProvider"
mock = "aire.integrations.mock:MockProvider"
echo = "aire.integrations.mock:EchoProvider"

[tool.hatch.build.targets.wheel]
packages = ["src/aire"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["docs", ".venv"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "C90",  # mccabe
    "RUF",  # ruff-specific
    "ASYNC", # flake8-async
    "S",    # flake8-bandit
    "ANN",  # annotations (public API typing discipline)
    "PT",   # pytest style
]
ignore = [
    "S101",    # asserts are expected in tests
    "ANN401",  # Any is allowed where explicitly justified
    "PLR0913", # many-argument builders are intentional
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S", "PT"]
"examples/**" = ["ANN", "S", "T201"]
"*/__init__.py" = ["F401"]
# typer.Option in argument defaults is the idiomatic typer pattern
"src/aire/cli/**" = ["B008"]
# table names are validated constructor options, not user SQL
"src/aire/rag/pgvector.py" = ["S608"]
"src/aire/graph/neo4j_store.py" = ["S608"]
# intentional PRNG for HPO / prompt search (not crypto)
"src/aire/training/hpo.py" = ["S311"]
"src/aire/optimization/prompt_opt.py" = ["S311", "S110"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["aire"]
strict = true
warn_unreachable = true
disallow_any_generics = false
exclude = "(tests|examples|docs)"

[[tool.mypy.overrides]]
module = ["yaml", "yaml.*"]
ignore_missing_imports = true

# fastapi is an optional dependency; its decorators are untyped when absent
[[tool.mypy.overrides]]
module = ["aire.deployment.fastapi_app", "aire.deployment.gateway", "aire.ui"]
disable_error_code = ["untyped-decorator"]

# torch/keras/boosting are optional; adapters import them lazily
[[tool.mypy.overrides]]
module = [
    "aire.ml.arch.*",
    "aire.ml.optim",
    "aire.ml.optim.*",
    "aire.ml.loss",
    "aire.ml.loss.*",
    "aire.ml.torch_adapter",
    "aire.ml.keras_adapter",
    "aire.ml.boosting",
    "aire.ml.polars_bridge",
    "aire.training.lora",
    "aire.training.lm_trainer",
    "aire.graph.neo4j_store",
    "aire.optimization.redis_cache",
    "aire.docs.pdf",
]
disable_error_code = ["name-defined", "misc", "untyped-decorator"]

[[tool.mypy.overrides]]
module = ["sacrebleu", "sacrebleu.*", "sentence_transformers", "sentence_transformers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: tests that exercise multiple subsystems together",
    "live: tests that require network access or credentials (skipped by default)",
    "performance: timing and resource usage checks",
    "security: adversarial and safety checks",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["src/aire"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]
