name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and verify only (skip PyPI upload)"
        type: boolean
        default: true

env:
  UV_PYTHON: "3.12"

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Verify release source and artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.0"
      - run: uv sync --locked --no-default-groups --group dev
      - name: Check repository metadata, current main and publication QA
        env:
          PUBLISH: ${{ github.event_name == 'push' || inputs.dry_run == false }}
          GH_TOKEN: ${{ github.token }}
        run: |
          .venv/bin/python scripts/release.py check
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - run: .venv/bin/ruff check src tests scripts
      - run: .venv/bin/ruff format --check src tests scripts
      - run: .venv/bin/mypy
      - run: .venv/bin/python -m pytest -m "not live and not optional"
      - run: .venv/bin/mkdocs build --strict
      - run: .venv/bin/python -m build --no-isolation --outdir release-bundle/dist
      - run: .venv/bin/twine check release-bundle/dist/*
      - run: .venv/bin/python scripts/verify_distribution.py release-bundle/dist/aire_ai-*.whl
      - run: .venv/bin/python scripts/release.py prepare
      - uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: release-bundle/

  verify-upload:
    name: Verify uploaded distribution artifacts
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.0"
      - uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: release-bundle/
      - run: uv sync --locked --no-default-groups --group release
      - run: .venv/bin/python scripts/release.py verify
      - run: .venv/bin/twine check release-bundle/dist/*
      - run: .venv/bin/python scripts/verify_distribution.py release-bundle/dist/aire_ai-*.whl

  publish:
    name: Publish and verify PyPI and GitHub release
    needs: [validate, verify-upload]
    if: github.event_name == 'push' || inputs.dry_run == false
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://pypi.org/project/aire-ai/
    permissions:
      id-token: write
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.0"
      - uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: release-bundle/
      - run: uv sync --locked --no-default-groups --group release
      - name: Recheck current main and completed QA immediately before publication
        env:
          PUBLISH: "true"
        run: .venv/bin/python scripts/release.py check
      - name: Verify provenance and existing PyPI files before uploading
        id: published
        run: .venv/bin/python scripts/release.py pypi
      - name: Stage isolated publisher inputs
        run: |
          mkdir -p release-bundle/upload
          cp release-bundle/dist/* release-bundle/upload/
      - uses: pypa/gh-action-pypi-publish@release/v1
        if: steps.published.outputs.complete != 'true'
        with:
          packages-dir: release-bundle/upload
          print-hash: true
          skip-existing: true
      - name: Verify published bytes and fresh installed package
        run: .venv/bin/python scripts/release.py pypi --install
      - name: Create GitHub release with verified assets
        run: |
          TAG="$GITHUB_REF_NAME"
          TITLE="Aire $TAG"
          NOTES=release-bundle/metadata/release-notes.md
          ASSETS=(release-bundle/dist/* release-bundle/metadata/SHA256SUMS release-bundle/metadata/provenance.json)
          if gh release view "$TAG" --json isDraft > "$RUNNER_TEMP/aire-release.json"; then
            if jq -e '.isDraft' "$RUNNER_TEMP/aire-release.json" > /dev/null; then
              gh release upload "$TAG" "${ASSETS[@]}" --clobber
              gh release edit "$TAG" --title "$TITLE" --notes-file "$NOTES" --draft=false --latest
            else
              gh release download "$TAG" --dir "$RUNNER_TEMP/aire-existing-release"
              for asset in "${ASSETS[@]}"; do
                cmp "$asset" "$RUNNER_TEMP/aire-existing-release/$(basename "$asset")"
              done
              gh release edit "$TAG" --title "$TITLE" --notes-file "$NOTES" --latest
            fi
          else
            gh release create "$TAG" "${ASSETS[@]}" --verify-tag --title "$TITLE" --notes-file "$NOTES" --latest
          fi
