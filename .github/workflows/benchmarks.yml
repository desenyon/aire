name: Benchmarks

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

env:
  UV_PYTHON: "3.12"

permissions:
  contents: write

jobs:
  microbench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.0"
      - name: Install locked test group
        run: uv sync --locked --no-default-groups --group test

      - name: Run offline microbenchmarks
        run: .venv/bin/python benchmarks/microbench.py --json benchmarks/results/latest.json --baseline benchmarks/baseline.json

      - name: Upload results
        uses: actions/upload-artifact@v7
        with:
          name: microbench-results
          path: benchmarks/results/latest.json
