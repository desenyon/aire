name: Benchmarks

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  microbench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Run offline microbenchmarks
        run: python benchmarks/microbench.py --json benchmarks/results/latest.json

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: microbench-results
          path: benchmarks/results/latest.json
