name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_PYTHON: "3.12"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  KERAS_BACKEND: torch
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"

jobs:
  core:
    name: Core ${{ matrix.os }} / ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON: ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.0"
          enable-cache: true
      - run: uv sync --locked --no-default-groups --group dev
      - run: uv run --locked --no-default-groups --group dev ruff check src tests scripts
      - run: uv run --locked --no-default-groups --group dev ruff format --check src tests scripts
      - run: uv run --locked --no-default-groups --group dev mypy
      - run: uv run --locked --no-default-groups --group dev pytest -m "not live and not optional"
      - name: Behavioral examples
        run: |
          for example in reliable_local agent_tools gateway_offline eval_gates; do
            uv run --locked --no-default-groups --group dev python "examples/$example/main.py"
          done
      - run: uv run --locked --no-default-groups --group dev mkdocs build --strict
      - run: uv run --locked --no-default-groups --group dev python -m build
      - name: Install wheel outside checkout
        run: uv run --locked --no-default-groups --group dev python scripts/verify_distribution.py dist/aire_ai-*.whl
      - name: Audit resolved production dependencies
        if: matrix.python == '3.12' && matrix.os == 'ubuntu-latest'
        run: |
          uv export --locked --no-dev --no-emit-project --format requirements-txt --output-file /tmp/aire-runtime.txt
          uv run --locked --no-default-groups --group dev pip-audit --strict -r /tmp/aire-runtime.txt

  minimum:
    name: Minimum binary-compatible core / ${{ matrix.python }}
    env:
      UV_PYTHON: ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.0"
      - run: uv venv
      - name: Install project without resolving dependencies
        run: uv pip install --python .venv/bin/python --no-deps -e .
      - name: Resolve oldest binary-compatible direct dependencies
        run: |
          python - <<'PYMIN'
          import pathlib, subprocess, tomllib
          project = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']
          subprocess.run(['uv', 'pip', 'install', '--python', '.venv/bin/python', '--only-binary', ':all:', '--resolution', 'lowest-direct', *project['dependencies'], *project['optional-dependencies']['serve'], 'pytest>=8', 'packaging>=24'], check=True)
          PYMIN
      - run: .venv/bin/python -m pytest -m "not live and not optional"
      - run: .venv/bin/aire doctor

  optional:
    name: Optional ${{ matrix.profile }} CPU
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: ml
            extras: --extra ml --extra torch --extra keras --extra xgboost --extra lightgbm --extra catboost
            tests: tests/optional/test_ml_backends.py
            floors: xgboost==3.2.0 keras==3.15.1
          - profile: training
            extras: --extra training --extra peft
            tests: tests/optional/test_lora_training.py tests/optional/test_distillation.py tests/optional/test_foundation_training.py
            floors: peft==0.20.0
          - profile: media
            extras: --extra ocr
            tests: tests/optional/test_media_contracts.py
            floors: pillow==12.3.0 pytesseract==0.3.13
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.0"
          enable-cache: true
      - name: Install media binaries
        if: matrix.profile == 'media'
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr ffmpeg fonts-dejavu-core
      - name: Install selected locked profile
        run: uv sync --locked --no-default-groups --group test ${{ matrix.extras }}
      - name: Execute locked backend contracts
        run: .venv/bin/python -m pytest ${{ matrix.tests }}
      - name: Install reviewed dependency floors
        run: uv pip install --python .venv/bin/python ${{ matrix.floors }}
      - name: Execute backend contracts at reviewed floors
        run: .venv/bin/python -m pytest ${{ matrix.tests }}

  docs-floor:
    name: Reviewed documentation dependency floor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.0"
      - run: uv sync --locked --no-default-groups --group docs
      - run: uv pip install --python .venv/bin/python "mkdocstrings[python]==1.0.7"
      - run: .venv/bin/mkdocs build --strict

  services:
    name: Real storage and generated container
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.0"
          enable-cache: true
      - run: uv sync --locked --no-default-groups --group test --group release --extra redis --extra pgvector --extra neo4j
      - run: .venv/bin/python -m build
      - run: .venv/bin/python scripts/verify_services.py --wheel dist/aire_ai-*.whl
